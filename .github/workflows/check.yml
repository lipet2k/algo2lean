name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full_lean:
        description: Run all Lean checks without restoring caches
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-and-editor:
    name: Compiler and editor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      lean-mode: ${{ steps.plan.outputs.lean-mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the editor toolchain
        run: npm ci
      - name: Check citation metadata
        run: python -m algo2lean.publication --check-citation
      - name: Check compiler and editor
        # Lean checks skip until a toolchain is installed in the separate job.
        # tests/test_editor.py runs the Vitest suite with the installed toolchain.
        run: python -m unittest discover -v
      - name: Check that the committed editor build matches its source
        run: node scripts/check_editor_build.mjs
      - name: Check the pinned browser runtime and downloadable proofs
        env:
          BROWSER_CHECK_SITE: ${{ runner.temp }}/algo2lean-browser-check
        run: |
          python scripts/build_site.py --download-runtime --output "$BROWSER_CHECK_SITE"
          version=$(python -c 'import json; print(json.load(open("publication.json"))["version"])')
          node scripts/check_browser_runtime.mjs "$BROWSER_CHECK_SITE/versions/v$version/runtime"
      - name: Select UI, package, or full Lean checks
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL_LEAN: ${{ inputs.force_full_lean }}
        run: python scripts/ci_plan.py

  lean:
    name: ${{ needs.compiler-and-editor.outputs.lean-mode == 'packages' && 'Lean download packages' || 'Lean semantics and proofs' }}
    needs: compiler-and-editor
    if: needs.compiler-and-editor.outputs.lean-mode != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.compiler-and-editor.outputs.lean-mode == 'packages' && 10 || 90 }}
    env:
      # Stable paths for the Python checkers' content-addressed caches.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.compiler-and-editor.outputs.lean-mode != 'packages'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the editor toolchain
        if: needs.compiler-and-editor.outputs.lean-mode != 'packages'
        run: npm ci
      - name: Install the toolchain pinned in lean-toolchain
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Require Lean before running semantic checks
        run: |
          lean --version
          lake --version
      - name: Check downloaded Lean projects
        if: needs.compiler-and-editor.outputs.lean-mode == 'packages'
        # Build standalone, shared-library, and imported-analysis bundles in
        # isolated directories. All non-Lean export/site tests ran above.
        run: python -m unittest tests.test_analysis_export.AnalysisExportBuildTests -v
      - name: Restore compiled Lean modules
        id: lean-cache
        if: needs.compiler-and-editor.outputs.lean-mode != 'packages' && (github.event_name == 'push' || github.event_name == 'pull_request') && inputs.force_full_lean != true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.TMPDIR }}/algo2lean-lean-cache
            ${{ env.TMPDIR }}/algo2lean-project-cache
          # Internal module keys include source/dependency identities. This
          # outer namespace invalidates compiler/checker changes. Test and UI
          # edits can reuse unchanged modules; assertions still run afresh.
          key: lean-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'algo2lean/**/*.py') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lean-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'algo2lean/**/*.py') }}-
      - name: Prepare pinned Mathlib for probability and real proofs
        if: needs.compiler-and-editor.outputs.lean-mode != 'packages'
        working-directory: probability
        run: |
          lake exe cache get
          lake build Algo2LeanProbability Algo2LeanReal
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib/Probability/Distributions/Uniform.olean
      - name: Check compiler, generated definitions, and analysis proofs
        if: needs.compiler-and-editor.outputs.lean-mode != 'packages'
        run: python -m unittest discover -v
      - name: Save compiled Lean modules from successful main checks
        if: success() && needs.compiler-and-editor.outputs.lean-mode != 'packages' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lean-cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.TMPDIR }}/algo2lean-lean-cache
            ${{ env.TMPDIR }}/algo2lean-project-cache
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
