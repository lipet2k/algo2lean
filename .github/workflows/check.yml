name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      force_full_lean:
        description: Run all Lean checks without restoring caches
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler-and-editor:
    name: Compiler and editor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run-lean: ${{ steps.plan.outputs.run-lean }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check citation metadata
        run: python -m algo2lean.publication --check-citation
      - name: Check compiler and editor
        # Lean checks skip until a toolchain is installed in the separate job.
        run: python -m unittest discover -v
      - name: Check every editor test
        run: node --test tests/test_*.js
      - name: Determine whether proof inputs need Lean checking
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL_LEAN: ${{ inputs.force_full_lean }}
        run: python scripts/ci_plan.py

  lean:
    name: Lean semantics and proofs
    needs: compiler-and-editor
    if: needs.compiler-and-editor.outputs.run-lean != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Stable paths for the Python checkers' content-addressed caches.
      TMPDIR: /tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the toolchain pinned in lean-toolchain
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1.6.1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Require Lean before running semantic checks
        run: lean --version
      - name: Restore compiled Lean modules
        id: lean-cache
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && inputs.force_full_lean != true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.TMPDIR }}/algo2lean-lean-cache
            ${{ env.TMPDIR }}/algo2lean-project-cache
          # Internal module keys include source/dependency identities. This
          # outer namespace also invalidates changed checker/test policy.
          key: lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'algo2lean/**/*.py', 'tests/**/*.py', '.github/workflows/check.yml') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lean-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'algo2lean/**/*.py', 'tests/**/*.py', '.github/workflows/check.yml') }}-
      - name: Check compiler, generated definitions, and analysis proofs
        run: python -m unittest discover -v
      - name: Save compiled Lean modules from successful main checks
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lean-cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.TMPDIR }}/algo2lean-lean-cache
            ${{ env.TMPDIR }}/algo2lean-project-cache
          key: ${{ steps.lean-cache.outputs.cache-primary-key }}
